<!doctype html>
<html lang="uz" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090A0D" />
    <meta name="description" content="Otaku — AniBla ekotizimidagi anime ijtimoiy tarmog'i va hamjamiyatlar markazi." />
    <title>Otaku — AniBla Ecosystem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://s4.anilist.co" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('otaku-store');
          var theme = raw ? (JSON.parse(raw).state || {}).theme : null;
          if (theme === 'light') document.documentElement.classList.remove('dark');
          else document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
